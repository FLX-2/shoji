name: Packages

# Points Homebrew and Scoop at a release: writes Casks/shoji.rb and bucket/shoji.json on main, which
# `brew tap flx-2/shoji https://github.com/FLX-2/shoji` and `scoop bucket add shoji https://github.com/FLX-2/shoji`
# read. It needs the release published and its installers attached, and those can come in either order: publishing
# a release from GitHub's page pushes its tag, and the Release workflow attaches the installers a while later, while
# a tag pushed first gets a draft that's published once read. So it runs at both moments, and the later one writes.
# Run it by hand to point them at an earlier release.
on:
  release:
    types: [published]
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release's tag, such as v0.4.0"
        required: true

permissions:
  contents: write

concurrency:
  group: packages
  cancel-in-progress: false

jobs:
  packages:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || github.event.workflow_run.head_branch || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the release is published with its installers
        id: ready
        run: |
          info=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets \
            --jq '[.isDraft, ([.assets[].name | select(endswith(".dmg") or endswith("_x64_en-US.msi"))] | length)] | @tsv' \
            || true)
          read -r draft assets <<< "$info"
          if [ -z "$draft" ]; then
            echo "::notice::There's no release for $TAG yet."
          elif [ "$draft" = "true" ]; then
            echo "::notice::$TAG is still a draft. This runs again when it's published."
          elif [ "$assets" -lt 3 ]; then
            echo "::notice::$TAG has $assets of its 3 Mac and Windows installers. This runs again when the Release workflow attaches them."
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.ready.outputs.go
        with:
          ref: main
      - name: Write the cask and the Scoop manifest
        if: steps.ready.outputs.go
        run: |
          mkdir -p "$RUNNER_TEMP/assets"
          gh release download "$TAG" --dir "$RUNNER_TEMP/assets" --pattern '*.dmg' --pattern '*_x64_en-US.msi'
          node scripts/packages.mjs "$TAG" "$RUNNER_TEMP/assets"
      - name: Commit them to main
        if: steps.ready.outputs.go
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks bucket
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Homebrew and Scoop point to Shoji $TAG"
          git push origin HEAD:main
