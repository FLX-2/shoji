name: Packages

# When a release is published, points Homebrew and Scoop at it: writes Casks/shoji.rb and bucket/shoji.json on
# main, which `brew tap flx-2/shoji https://github.com/FLX-2/shoji` and
# `scoop bucket add shoji https://github.com/FLX-2/shoji` read. Run it by hand to point them at an earlier release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release's tag, such as v0.4.0"
        required: true

permissions:
  contents: write

jobs:
  packages:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Write the cask and the Scoop manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/assets"
          gh release download "$TAG" --dir "$RUNNER_TEMP/assets" --pattern '*.dmg' --pattern '*_x64_en-US.msi'
          node scripts/packages.mjs "$TAG" "$RUNNER_TEMP/assets"
      - name: Commit them to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks bucket
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Homebrew and Scoop point to Shoji $TAG"
          git push origin HEAD:main
