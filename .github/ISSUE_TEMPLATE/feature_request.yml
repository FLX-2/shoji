name: Feature request
description: Something you'd like Shoji to do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The task or the moment where Shoji falls short today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you'd like it to work. A rough idea is fine.
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Other tools that do this well, screenshots or sketches.
